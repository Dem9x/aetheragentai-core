services:
  postgres:
    image: postgres:16.9-alpine3.21
    restart: unless-stopped

    environment:
      POSTGRES_DB: aetheragentai
      POSTGRES_USER: aaa
      POSTGRES_PASSWORD: aaa

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aaa -d aetheragentai"]
      interval: 5s
      timeout: 5s
      retries: 10

    networks:
      - internal

  redis:
    image: redis:7.4-alpine3.21
    restart: unless-stopped

    command: >
      redis-server
      --appendonly yes
      --save 60 1000

    ports:
      - "6379:6379"

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    env_file:
      - .env

    environment:
      DATABASE_URL: postgresql://aaa:aaa@postgres:5432/aetheragentai
      REDIS_URL: redis://redis:6379

    ports:
      - "3000:3000"

    networks:
      - internal

volumes:
  postgres_data:

networks:
  internal:
    driver: bridge